<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail</title>
    <style>
        body {
            background: linear-gradient(180deg, #001230 0%, #003280 100%);
            background-attachment: fixed;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .window-close {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #c00000, #ff0000);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            z-index: 1000;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 20px;
            margin-top: 60px;
        }

        img {
            max-width: 100%;
            margin: 20px 0;
            border-radius: 10px;
        }

        .content {
            line-height: 1.6;
            font-size: 1em;
        }

        a {
            color: #00ff00;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="window-close" onclick="history.back()">×</div>
    <div class="container">
        <h1 id="title">Chargement...</h1>
        <img id="image" src="" alt="Image" style="display: none;">
        <div id="content" class="content">Chargement...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const folderName = params.get('name');
        const mdUrl = params.get('md');
        const imgUrl = params.get('img');

        async function loadContent() {
            try {
                document.getElementById('title').textContent = folderName;
                
                if (imgUrl) {
                    const img = document.getElementById('image');
                    img.src = imgUrl;
                    img.style.display = 'block';
                }

                const response = await fetch(mdUrl);
                const markdown = await response.text();
                document.getElementById('content').innerHTML = marked(markdown);
            } catch (err) {
                document.getElementById('content').innerHTML = 'Erreur lors du chargement du contenu';
                console.error('Erreur:', err);
            }
        }

        loadContent();
    </script>
</body>
</html>
